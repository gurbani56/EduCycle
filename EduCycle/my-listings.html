<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My listings | EduCycle</title>
  <meta name="description" content="EduCycle: donate, lend and exchange textbooks, components and lab equipment with other students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="listings" data-active="listings">
  <div id="site-nav"></div>

  <main id="main">
    <div class="container narrow page">
      <div class="page-head"><h1>My listings</h1></div>

      <div class="filterline">
        <div class="tabs-line" id="listingsTabs" role="tablist" aria-label="Filter by status">
          <button type="button" role="tab" data-status="" class="active">All<span class="n"></span></button>
          <button type="button" role="tab" data-status="Available">Available<span class="n"></span></button>
          <button type="button" role="tab" data-status="Reserved">Reserved<span class="n"></span></button>
          <button type="button" role="tab" data-status="Unavailable">Unavailable<span class="n"></span></button>
        </div>
      </div>

      <div class="listing-list border-top-0" id="manageList"></div>
      <div class="empty-state d-none" id="manageEmpty"><p id="emptyText">You have not listed anything yet.</p></div>
      <a class="add-row" href="list-resource.html">Give a resource</a>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="deleteModalTitle">Delete this listing?</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body"><strong id="deleteName"></strong> will be removed from Browse. This cannot be undone.</div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-eco" data-bs-dismiss="modal">Keep it</button><button type="button" class="btn btn-soft-danger" id="confirmDelete">Delete</button></div>
      </div></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/my-listings.js"></script>
</body>
</html>
