<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | EduCycle</title>
  <meta name="description" content="EduCycle: donate, lend and exchange textbooks, components and lab equipment with other students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login" data-active="login">
  <div id="site-nav"></div>

  <main id="main">
    <div class="auth-page">
      <div class="auth-box">
        <h1 id="authTitle">Log in</h1>
        <div class="tabs-line auth-tabs" role="tablist">
          <button type="button" class="active" id="tab-login" role="tab" aria-selected="true">Log in</button>
          <button type="button" id="tab-register" role="tab" aria-selected="false">Create account</button>
        </div>

        <div class="alert alert-warning d-none" id="loginRequired" role="alert">Please log in to continue.</div>

        <div id="pane-login" role="tabpanel">
          <div class="alert alert-eco d-none" id="registerSuccess" role="status">Account created. You can log in now.</div>
          <form id="loginForm" novalidate>
            <div class="field mb-3">
              <label class="form-label" for="loginEmail">College email</label>
              <input type="email" class="form-control" id="loginEmail" placeholder="name@college.edu" autocomplete="email">
              <div class="invalid-feedback"></div>
            </div>
            <div class="field mb-4">
              <label class="form-label" for="loginPassword">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="loginPassword" autocomplete="current-password">
                <button class="btn btn-outline-eco" type="button" data-toggle-password="loginPassword" aria-label="Show password">Show</button>
              </div>
              <div class="invalid-feedback"></div>
            </div>
            <button class="btn btn-eco btn-lg w-100" type="submit">Log in</button>
          </form>
        </div>

        <div id="pane-register" class="d-none" role="tabpanel">
          <form id="registerForm" novalidate>
            <div class="field mb-3">
              <label class="form-label" for="regName">Full name</label>
              <input type="text" class="form-control" id="regName" autocomplete="name">
              <div class="invalid-feedback"></div>
            </div>
            <div class="field mb-3">
              <label class="form-label" for="regEmail">College email</label>
              <input type="email" class="form-control" id="regEmail" placeholder="name@college.edu" autocomplete="email">
              <div class="invalid-feedback"></div>
            </div>
            <div class="field mb-3">
              <label class="form-label" for="regPassword">Password</label>
              <div class="input-group">
                <input type="password" class="form-control" id="regPassword" placeholder="8+ characters, letters and numbers" autocomplete="new-password">
                <button class="btn btn-outline-eco" type="button" data-toggle-password="regPassword" aria-label="Show password">Show</button>
              </div>
              <div class="invalid-feedback"></div>
            </div>
            <div class="row g-3 mb-4">
              <div class="col-sm-7 field"><label class="form-label" for="regDept">Department</label><select class="form-select" id="regDept"></select><div class="invalid-feedback"></div></div>
              <div class="col-sm-5 field"><label class="form-label" for="regSem">Semester</label><select class="form-select" id="regSem"></select><div class="invalid-feedback"></div></div>
            </div>
            <button class="btn btn-eco btn-lg w-100" type="submit">Create account</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
