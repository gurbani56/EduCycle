<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse | EduCycle</title>
  <meta name="description" content="EduCycle: donate, lend and exchange textbooks, components and lab equipment with other students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="browse" data-active="browse">
  <div id="site-nav"></div>

  <main id="main">
    <section class="browse-hero">
      <div class="container">
        <div class="page-head">
          <h1>Browse</h1>
          <p class="page-count" id="resultCount" aria-live="polite"></p>
        </div>
        <div class="cat-chip-row" id="catChipRow">
          <button type="button" class="cat-chip" data-category="Books"><i class="bi bi-book" aria-hidden="true"></i>Books</button>
          <button type="button" class="cat-chip" data-category="Notes"><i class="bi bi-journal-text" aria-hidden="true"></i>Notes</button>
          <button type="button" class="cat-chip" data-category="Electronics"><i class="bi bi-cpu" aria-hidden="true"></i>Electronics</button>
          <button type="button" class="cat-chip" data-category="Calculators"><i class="bi bi-calculator" aria-hidden="true"></i>Calculators</button>
          <button type="button" class="cat-chip" data-category="Lab Equipment"><i class="bi bi-tools" aria-hidden="true"></i>Lab Equipment</button>
        </div>
      </div>
    </section>

    <div class="container page">
      <div class="filterline">
        <div class="tabs-line" id="typeTabs" role="tablist" aria-label="Filter by type">
          <button type="button" role="tab" data-type="" class="active">All<span class="n"></span></button>
          <button type="button" role="tab" data-type="Donate">Donate<span class="n"></span></button>
          <button type="button" role="tab" data-type="Lend">Lend<span class="n"></span></button>
          <button type="button" role="tab" data-type="Exchange">Exchange<span class="n"></span></button>
        </div>
        <div class="tabs-tools">
          <div class="dropdown">
            <button class="tool-btn" type="button" id="categoryBtn" data-bs-toggle="dropdown" aria-expanded="false">Category: <strong>All</strong></button>
            <ul class="dropdown-menu dropdown-menu-end" id="categoryMenu"></ul>
          </div>
          <div class="dropdown">
            <button class="tool-btn" type="button" id="narrowBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Narrow down<span class="count-badge" id="narrowCount"></span></button>
            <div class="dropdown-menu dropdown-menu-end narrow-panel p-3">
              <div class="mb-3"><label class="form-label" for="fCondition">Condition</label><select class="form-select form-select-sm" id="fCondition"></select></div>
              <div class="mb-3"><label class="form-label" for="fDepartment">Suited for</label><select class="form-select form-select-sm" id="fDepartment"></select></div>
              <div class="mb-2"><label class="form-label" for="fSemester">Semester</label><select class="form-select form-select-sm" id="fSemester"></select></div>
              <button type="button" class="btn btn-link btn-sm px-0" id="narrowClear">Clear these</button>
            </div>
          </div>
        </div>
      </div>
      <div class="active-filters d-none" id="activeFilters"></div>

      <div class="listing-list border-top-0" id="listingList"></div>
      <button type="button" class="btn btn-link show-more d-none" id="showMore">Show more</button>
      <div class="empty-state d-none" id="emptyState">
        <p>Nothing matches these filters.</p>
        <div class="actions"><button type="button" class="btn btn-outline-eco" data-clear="all">Clear filters</button><a class="link-arrow align-self-center" href="request-board.html">Post a request &rarr;</a></div>
      </div>

      <div class="promo-band">
        <div class="promo-inner">
          <h2>Got something gathering dust?</h2>
          <p>List it in under a minute and help another student.</p>
          <a class="btn btn-accent btn-lg" href="list-resource.html">List a resource</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
