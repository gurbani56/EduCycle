<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resource | EduCycle</title>
  <meta name="description" content="EduCycle: donate, lend and exchange textbooks, components and lab equipment with other students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="details" data-active="browse">
  <div id="site-nav"></div>

  <main id="main">
    <div class="container page">
      <div class="detail">
        <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="browse.html">Browse</a></li><li class="breadcrumb-item active" aria-current="page" id="crumbName">Resource</li></ol></nav>
        <div id="detailRoot"></div>
        <section class="mt-5" id="moreSection">
          <h2 class="block-title">More available</h2>
          <div class="listing-list" id="moreList"></div>
        </section>
      </div>
    </div>

    <div class="modal fade" id="requestModal" tabindex="-1" aria-labelledby="requestModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="requestModalTitle">Request this resource</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <p>You are requesting <strong id="requestResourceName"></strong>. The owner will be notified and can accept or decline.</p>
          <label class="form-label" for="requestMessage">Message to the owner (optional)</label>
          <textarea class="form-control" id="requestMessage" rows="3" maxlength="200" placeholder="What do you need it for, and for how long?"></textarea>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-eco" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-eco" id="confirmRequest">Send request</button></div>
      </div></div>
    </div>

    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h2 class="modal-title h5" id="reportModalTitle">Report this listing</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <form id="reportForm" novalidate><div class="modal-body">
          <div class="field">
            <label class="form-label" for="reportReason">Reason</label>
            <select class="form-select" id="reportReason">
              <option value="">Select a reason</option><option>Not as described</option><option>Inappropriate or misleading</option><option>Duplicate listing</option><option>Other</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>
        </div></form>
        <div class="modal-footer"><button type="button" class="btn btn-outline-eco" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-eco" id="confirmReport">Submit report</button></div>
      </div></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/details.js"></script>
</body>
</html>
