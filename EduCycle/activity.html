<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Activity | EduCycle</title>
  <meta name="description" content="EduCycle: donate, lend and exchange textbooks, components and lab equipment with other students.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="activity" data-active="activity">
  <div id="site-nav"></div>

  <main id="main">
    <div class="container narrow page">
      <div class="page-head"><h1>Your Activity</h1></div>
      <div class="summary-line" id="impactLine"></div>

      <div class="filterline">
        <div class="tabs-line" id="activityTabs" role="tablist" aria-label="Exchanges">
          <button type="button" role="tab" data-tab="needs" class="active">Needs your action<span class="n"></span></button>
          <button type="button" role="tab" data-tab="waiting">Waiting on others<span class="n"></span></button>
          <button type="button" role="tab" data-tab="history">History<span class="n"></span></button>
        </div>
      </div>

      <div class="xchg-list border-top-0" id="activityList"></div>
      <div class="empty-state d-none" id="empty-needs"><p>Nothing needs your response right now.</p><div class="actions"><a class="btn btn-eco" href="list-resource.html">Give a resource</a></div></div>
      <div class="empty-state d-none" id="empty-waiting"><p>You have no open requests.</p><div class="actions"><a class="btn btn-eco" href="browse.html">Browse resources</a></div></div>
      <div class="empty-state d-none" id="empty-history"><p>Completed and declined requests will appear here.</p></div>
    </div>
  </main>

  <div id="site-footer"></div>
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/activity.js"></script>
</body>
</html>
