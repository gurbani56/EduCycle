<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin dashboard | EduCycle</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body class="admin-body" data-area="admin">
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="admin-shell">
    <aside class="admin-side" id="adminSide" aria-label="Admin navigation">
      <a class="brand" href="admin.html#overview"><span class="brand-mark" aria-hidden="true"><i class="bi bi-arrow-repeat"></i></span><span>EduCycle<small>Administration</small></span></a>
      <ul class="admin-nav">
        <li><a href="#overview" data-view="overview"><i class="bi bi-speedometer2" aria-hidden="true"></i>Overview</a></li>
        <li><a href="#resources" data-view="resources"><i class="bi bi-box-seam" aria-hidden="true"></i>Resources<span class="n d-none" data-badge="reportedListings"></span></a></li>
        <li><a href="#requests" data-view="requests"><i class="bi bi-arrow-left-right" aria-hidden="true"></i>Requests &amp; exchanges</a></li>
        <li><a href="#locations" data-view="locations"><i class="bi bi-geo-alt" aria-hidden="true"></i>Locations<span class="n d-none" data-badge="pendingLocations"></span></a></li>
        <li><a href="#grievances" data-view="grievances"><i class="bi bi-flag" aria-hidden="true"></i>Grievances<span class="n d-none" data-badge="openGrievances"></span></a></li>
        <li><a href="#users" data-view="users"><i class="bi bi-people" aria-hidden="true"></i>Users</a></li>
        <li><a href="#activity" data-view="activity"><i class="bi bi-clock-history" aria-hidden="true"></i>Activity log</a></li>
      </ul>
      <div class="side-foot">
        <div class="d-flex align-items-center gap-2 mb-2"><span class="avatar" id="adminAvatar" aria-hidden="true" style="background:#fff;color:var(--ec-ink)"></span><div class="min-w-0"><div class="text-white fw-semibold truncate" id="adminName"></div><div class="truncate small" id="adminEmail"></div></div></div>
        <a href="index.html"><i class="bi bi-box-arrow-up-right" aria-hidden="true"></i> View student site</a>
      </div>
    </aside>

    <div class="min-w-0">
      <header class="admin-top">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-secondary btn-sm d-lg-none" type="button" id="sideToggle" aria-controls="adminSide" aria-expanded="false" aria-label="Open navigation"><i class="bi bi-list" aria-hidden="true"></i></button>
          <h1 id="viewTitle">Overview</h1>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-secondary btn-sm" type="button" id="refreshBtn"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i><span class="d-none d-sm-inline">Refresh</span></button>
          <button class="btn btn-dark btn-sm" type="button" id="logoutBtn"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Log out</button>
        </div>
      </header>
      <main class="admin-main" id="view" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <!-- Detail drawer -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="drawer" aria-labelledby="drawerTitle">
    <div class="offcanvas-header"><h2 class="offcanvas-title h5" id="drawerTitle">Details</h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button></div>
    <div class="offcanvas-body" id="drawerBody"></div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-area"></div>
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/admin.js"></script>
</body>
</html>
